# git-cliff configuration — partrack user-facing changelog.
#
# STRICT OPT-IN: a commit appears in the changelog ONLY if it carries a
# `Changelog:` trailer in its footer. The trailer's text (not the commit
# subject) is what users see; `Changelog: skip` force-excludes a commit.
#
#   feat(bom): broaden generic part matching (package-only, multi-param)
#
#   Changelog: BOM import now matches generic parts by footprint alone.
#
# See doc/commit-convention.md for the full convention.
#
# NOTE: git-cliff is not vendored; the release workflow installs it. If the
# template/parsers need adjusting for the installed git-cliff version, validate
# with `git cliff --unreleased` on first run.

[changelog]
header = """
# Changelog

User-facing changes to partrack. Entries are curated: each one comes from a
commit carrying a `Changelog:` trailer (see [doc/commit-convention.md](doc/commit-convention.md)).
This file is generated by git-cliff in the release workflow — do not edit by hand.\n
"""
# For each release we print the version + date, then the curated trailer text of
# every commit that has a (non-skip) `Changelog:` footer. Commits without the
# trailer are silently dropped by the loop.
body = """
{% if version %}\
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for commit in commits %}\
{% for f in commit.footers %}\
{% if f.token == "Changelog" and f.value | trim | lower != "skip" %}\
- {{ f.value | trim }}
{% endif %}\
{% endfor %}\
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
# Drop everything except commits carrying a (non-skip) `Changelog:` footer, so
# the body template only ever iterates user-facing entries.
filter_commits = true
commit_parsers = [
  { footer = "(?im)^Changelog:\\s*skip\\s*$", skip = true },
  { footer = "(?im)^Changelog:", group = "Changes" },
  { message = ".*", skip = true },
]
# CalVer release tags, e.g. 2026.6.0
tag_pattern = "[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "newest"
