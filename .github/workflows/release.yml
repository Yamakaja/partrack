name: Release

# Cut a release by pushing a CalVer tag, e.g.:
#   git tag 2026.6.0 && git push origin 2026.6.0
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'   # CalVer: YEAR.MONTH.PATCH

permissions:
  contents: write   # create the GitHub Release (and commit the regenerated CHANGELOG)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so git-cliff can build the changelog

      # Notes for THIS tag only — used as the GitHub Release body.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: notes
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # Full regenerated changelog (all releases) — committed back to the repo.
      - name: Regenerate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
