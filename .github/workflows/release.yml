name: Release

# Cut a release by pushing a CalVer tag, e.g.:
#   git tag 2026.6.0 && git push origin 2026.6.0
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'   # CalVer: YEAR.MONTH.PATCH

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so git-cliff can build the notes

      # The changelog is generated on demand from git history — it is not stored
      # in the repo. Here we render the notes for THIS tag as the Release body.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: notes
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
