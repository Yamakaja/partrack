services:
  db:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    image: partrack-postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: partrack
      POSTGRES_USER: partrack
      POSTGRES_PASSWORD: "${PARTRACK_DB_PASSWORD:?PARTRACK_DB_PASSWORD is required}"
    volumes:
      - pgdata:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  partrack:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: partrack:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PARTRACK_PORT:-8080}:8080"
    environment:
      # Required — must be set in .env or the shell environment
      PARTRACK_DB_URL: "postgres://partrack:${PARTRACK_DB_PASSWORD}@db/partrack?sslmode=disable"
      PARTRACK_SESSION_SECRET: "${PARTRACK_SESSION_SECRET:?PARTRACK_SESSION_SECRET is required}"
      PARTRACK_APP_BASE_URL: "${PARTRACK_APP_BASE_URL:?PARTRACK_APP_BASE_URL is required}"
      PARTRACK_LISTEN_ADDR: ":8080"
      # Optional OIDC provider secrets (e.g. PARTRACK_OIDC_GOOGLE_SECRET).
      # OIDC provider registration (issuer, client_id, etc.) requires a config
      # file — mount one at /etc/partrack/config.yaml and set:
      #   PARTRACK_CONFIG: /etc/partrack/config.yaml
    # volumes:
    #   - ./config.yaml:/etc/partrack/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
